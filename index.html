<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crux Studios | Custom Web &amp; Mobile App Development</title>
  <meta name="description"
    content="A boutique development studio in Bangalore. We build custom web apps, mobile apps, and MVPs for founders and businesses, then hand over 100% of the code." />
  <link rel="canonical" href="https://cruxstudios.dev/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#7c3aed" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Crux Studios" />
  <meta property="og:title" content="Crux Studios | Custom Web &amp; Mobile App Development" />
  <meta property="og:description" content="A boutique development studio in Bangalore. We build custom web apps, mobile apps, and MVPs for founders and businesses, then hand over 100% of the code." />
  <meta property="og:url" content="https://cruxstudios.dev/" />
  <meta property="og:image" content="https://cruxstudios.dev/og-image.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@cruxstudios" />
  <meta name="twitter:title" content="Crux Studios | Custom Web &amp; Mobile App Development" />
  <meta name="twitter:description" content="A boutique development studio in Bangalore. We build custom web apps, mobile apps, and MVPs for founders and businesses, then hand over 100% of the code." />
  <meta name="twitter:image" content="https://cruxstudios.dev/og-image.png" />

  <!-- WebSite Structured Data — tells Google the preferred site name -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Crux Studios",
    "alternateName": ["Crux"],
    "url": "https://cruxstudios.dev/"
  }
  </script>

  <!-- High-Priority Asset Preloads for Instant First-Paint -->
  <link rel="preload" as="image" href="/assets/bg-light-mesh.webp" type="image/webp" fetchpriority="high">
  <link rel="preload" as="image" href="/logo.webp" type="image/webp" fetchpriority="high">

  <!-- Typography: Google Sans (Headings & Display) + Google Sans Text & Roboto (UI & Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800&family=Google+Sans+Text:ital,wght@0,400;0,500;0,700;1,400&family=Roboto:wght@400;500;700;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/src/styles/main.css" />
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('crux_theme');
        const theme = saved === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { }
    })();
  </script>
</head>

<body class="has-grid-bg">

  <!-- Navigation Component -->
  <load src="src/components/navbar.html" />

  <main>
    <!-- Section 1: Hero -->
    <load src="src/sections/hero.html" />

    <!-- Section 2: Shipped Work -->
    <load src="src/sections/projects.html" />

    <!-- Section 3: Why Crux Stats -->
    <load src="src/sections/stats.html" />

    <!-- Section 4: What We Build For You -->
    <load src="src/sections/services.html" />

    <!-- Section 5: Cross-Platform -->
    <load src="src/sections/platforms.html" />

    <!-- Section 6: Who It's For -->
    <load src="src/sections/personas.html" />

    <!-- Section 7: Process -->
    <load src="src/sections/architecture.html" />

    <!-- Section 8: Team -->
    <load src="src/sections/team.html" />

    <!-- Section 9: FAQs -->
    <load src="src/sections/faqs.html" />

    <!-- Section 10: Footer & Final CTA -->
    <load src="src/components/footer.html" />
  </main>

  <!-- Global Floating Cursor Badge for Copy Email -->
  <load src="src/components/email-cursor.html" />

  <script type="module" src="/src/scripts/main.js"></script>
</body>

</html>
